<ion-card class="group-card">

  <div class="header">
    <h2>Monitoria & estudo</h2>

    <ion-button fill="clear" size="small">
      <ion-icon name="ellipsis-horizontal" class="button-inner"></ion-icon>
    </ion-button>
  </div>

  <img
    src="assets/img/study.jpg"
    alt="Grupo"
    class="group-image"
  />

  <div class="members">

    <div class="member winner">

      <div class="avatar">
        MP
        <ion-icon
          name="star"
          class="crown">
        </ion-icon>
      </div>

      <div class="info">
        <span class="name">Marcos</span>
        <span class="checkins">6 check-ins</span>
      </div>

    </div>

    <div class="member">

      <div class="avatar pink">
        HA
      </div>

      <div class="info">
        <span class="name">Você</span>
        <span class="checkins">5 check-ins</span>
      </div>

    </div>

  </div>

</ion-card>
