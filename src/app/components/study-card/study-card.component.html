<ion-card class="group-card">

  <div class="header">
    <h2>Monitoria & estudo</h2>

    <ion-button fill="clear" size="small" id="button-inner" fill="clear" (click)="abrirDropdown($event)">
      <ion-icon name="ellipsis-horizontal" class="button-inner" (click)="abrirDropdown($event)"></ion-icon>
    </ion-button>

    <ion-popover
      [isOpen]="dropdownAberto"
      [event]="eventoDropdown"
      (didDismiss)="dropdownAberto = false"v
      class="study-dropdown"
    >
      <ng-template>
        <ion-list lines="none">

          <ion-item button (click)="compartilharGrupo()">
            <ion-icon
              name="share-social-outline"
              slot="start"
            ></ion-icon>

            <ion-label>Compartilhar grupo</ion-label>
          </ion-item>

          <ion-item button (click)="sairDoGrupo()">
            <ion-icon
              name="exit-outline"
              slot="start"
            ></ion-icon>

            <ion-label>Sair do grupo</ion-label>
          </ion-item>

        </ion-list>
      </ng-template>
    </ion-popover>
  </div>

  <img
    src="assets/img/study.jpg"
    alt="Grupo"
    class="group-image"
  />

  <div class="members">

    <div class="member winner">

      <div class="avatar">
        MP
        <ion-icon
          name="star"
          class="crown">
        </ion-icon>
      </div>

      <div class="info">
        <span class="name">Marcos</span>
        <span class="checkins">6 check-ins</span>
      </div>

    </div>

    <div class="member">

      <div class="avatar pink">
        HA
      </div>

      <div class="info">
        <span class="name">Você</span>
        <span class="checkins">5 check-ins</span>
      </div>

    </div>

  </div>

</ion-card>
